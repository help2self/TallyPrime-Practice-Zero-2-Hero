<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TallyPrime Practice — Scholar Computer Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#12172A;--line:#2C3348;--ink:#EEF0FA;--mut:#9AA0C0;--a:#8C6BFF;--b:#22D6CC;--gold:#E8B94A;--ok:#2ED888;--or:#FF9A3C;--cr:#FF6B7A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,'Noto Sans Devanagari',sans-serif}a{color:var(--b);text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:8px 12px}
#hm{flex:none;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:#1A2038;font-size:18px}
#q{flex:1;min-width:0;height:42px;padding:0 16px;border:1px solid var(--line);border-radius:24px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.w{max-width:920px;margin:0 auto;padding:14px 16px 130px}
.hero{text-align:center;background:#0B1020;border:1px solid var(--line);border-radius:18px;padding:22px 16px;margin:4px 0 14px}
.brand{color:var(--gold);font-weight:700;letter-spacing:.18em;font-size:13px;text-transform:uppercase}.sub{color:var(--mut);margin:6px auto 14px;max-width:560px}
h1.t{font-family:Fraunces,serif;font-size:clamp(26px,6vw,38px);margin:8px 0 4px;line-height:1.2}h1.t span{color:var(--cr)}
.go{display:inline-block;margin:6px 0 4px;padding:11px 20px;border-radius:12px;background:linear-gradient(90deg,var(--a),var(--b));color:#000;font-weight:700}
.pm{color:var(--mut);font-size:13px;margin-top:6px}.pg{height:6px;background:var(--line);border-radius:3px;margin:6px auto 0;max-width:340px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
.lvs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;justify-content:center}.lc{border:1px solid var(--c);color:var(--c);border-radius:20px;padding:4px 14px;font-size:14px;font-weight:600}
.part{color:var(--gold);font-weight:700;margin:24px 0 6px}
.cc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;color:var(--ink)}.cc:hover{border-color:var(--a)}.cc.dn{border-color:var(--ok)}
.cn{flex:none;width:44px;height:44px;border-radius:12px;background:#1A2038;color:var(--b);display:grid;place-items:center;font-weight:700}.rb{flex:1;min-width:0;line-height:1.4}.rb small{display:block;color:var(--mut);font-size:13px}.ar{color:var(--b);font-size:18px}.dn .ar{color:var(--ok)}
.top{display:flex;justify-content:space-between;gap:8px;margin:10px 0;flex-wrap:wrap}.nb,button{font:600 14px Inter,'Noto Sans Devanagari',sans-serif;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#1A2038;color:var(--ink);cursor:pointer}
button.on{background:linear-gradient(90deg,var(--a),var(--b));color:#000;border:0}
.pcd{scroll-margin-top:64px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0}.pcd.done{border-color:var(--ok)}.pcd[open]{border-color:var(--a)}
.pcd>summary{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none;color:var(--ink);font-weight:600}.pcd>summary::-webkit-details-marker{display:none}.pcd>summary:after{content:'▾';color:var(--mut)}.pcd[open]>summary:after{content:'▴'}
.pn{flex:none;width:30px;height:30px;border-radius:9px;background:#1A2038;color:var(--b);display:grid;place-items:center;font-size:14px}.pt{flex:1;min-width:0;line-height:1.35}.lv{color:var(--c);font-size:12px;white-space:nowrap}.ck{color:var(--ok)}
.pq,.btns,.flow,.rv{margin-left:14px;margin-right:14px}.pq{padding-top:2px}.flow{color:var(--mut);font-size:13px;margin-top:8px;margin-bottom:0}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;margin-bottom:14px}
.rv{--c:var(--line);background:#0B1020;border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));border-radius:12px;padding:10px 12px;margin-top:0;margin-bottom:10px}.rv.h{--c:var(--gold)}.rv.f{--c:var(--ok)}
.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:#1A2038;color:var(--gold)}
.callout{background:#0B1020;border:1px solid color-mix(in srgb,var(--b) 45%,var(--line));border-radius:10px;padding:10px 14px;margin:10px 0}.callout p{margin:4px 0}.ct{display:block;color:var(--b)}
h2,h3,h4,h5{line-height:1.3}ul{padding-left:22px}.gd{margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}.gd>summary{cursor:pointer;font-weight:600;color:var(--gold);padding:8px 0}
.rv .callout{background:none;border:0;border-radius:0;padding:0;margin:12px 0 4px}.rv .callout p{margin:4px 0}.rs a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin:8px 0;color:var(--ink)}.rs small{display:block;color:var(--mut)}mark{background:var(--gold);color:#000;border-radius:3px;padding:0 2px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:40px}
#sc{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:6}#sc button{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;line-height:1;background:var(--card);color:var(--b);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;cursor:pointer}#sc button.v{opacity:.95;pointer-events:auto}@media print{#sc{display:none}}</style></head><body>
<header><a id="hm" href="#/" title="Home" aria-label="Home">🏠</a><input id="q" type="search" placeholder="🔎 Search — e.g. GST, Journal, TDS, BRS…" autocomplete="off"></header>
<div id="sc"><button id="su" aria-label="Top" title="Top">↑</button><button id="sd" aria-label="Bottom" title="Bottom">↓</button></div>
<div class="w" id="app"></div>
<script>
const $=document.getElementById('app'),K='scii_done',V='?v=20261014';
const done=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return {}}};
const save=d=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}};
const j=async u=>{const r=await fetch(u+V);if(!r.ok)throw 0;return r.json()};
let IDX=null;const CH={};const ldc=n=>CH[n]||(CH[n]=j('ch'+n+'.json'));
const LV={Basic:['🟢','--ok'],Intermediate:['🟡','--gold'],Advanced:['🟠','--or'],Expert:['🔴','--cr']},LVC={"Basic": 63, "Intermediate": 59, "Advanced": 31, "Expert": 40};
const lvOf=q=>(q.match(/(Basic|Intermediate|Advanced|Expert)/)||[0,'Basic'])[1];
const TA=document.createElement('textarea'),tx=h=>(TA.innerHTML=h.replace(/<[^>]+>/g,' '),TA.value.replace(/\s+/g,' ').trim());
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),hl=(s,q)=>esc(s).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
const nDone=n=>Object.keys(done()).filter(k=>k.startsWith(n+'-')).length;
const bar=(a,b)=>`<div class="pg"><i style="width:${b?100*a/b:0}%"></i></div>`;
const chips=o=>`<div class="lvs">${Object.keys(LV).map(k=>o[k]?`<a class="lc" style="--c:var(${LV[k][1]})" href="#/lv/${k}">${LV[k][0]} ${k} ${o[k]}</a>`:'').join('')}</div>`;
async function home(){IDX=IDX||await j('index.json');const d=done(),tot=IDX.reduce((a,c)=>a+c.count,0),dn=Math.min(tot,Object.keys(d).length);let nx=null;
 for(const c of IDX){for(let n=1;n<=c.count;n++)if(!d[c.num+'-'+n]){nx=[c.num,n];break}if(nx)break}
 const G=IDX.reduce((g,c)=>{const l=c.part||'';if(g.length&&g[g.length-1][0]==l)g[g.length-1][1].push(c);else g.push([l,[c]]);return g},[]);
 const row=c=>{const n=nDone(c.num),f=n>=c.count;return `<a class="cc${f?' dn':''}" href="#/ch/${c.num}"><span class="cn">${c.num}</span><span class="rb"><b>${c.title}</b><small>${c.count} problems · ${n} done</small></span><span class="ar">${f?'✓':'→'}</span></a>`};
 $.innerHTML=`<section class="hero"><div class="brand">Scholar Computer Institute</div><p class="sub" style="margin:2px 0 0">Nizamabad – Azamgarh</p><h1 class="t">TallyPrime <span>Practice</span></h1><p class="sub">हर problem हल कीजिए — अटक जाएँ तो उसी के नीचे Hint और Solution देखिए।</p>${nx?`<a class="go" href="#/ch/${nx[0]}/${nx[1]}">▶ ${dn?'Continue':'Start'}: Chapter ${nx[0]} · Problem ${nx[1]}</a>`:'<div class="go">🎉 All problems done!</div>'}<div class="pm">${dn} / ${tot} problems done</div>${bar(dn,tot)}</section>${chips(LVC)}${G.map(([l,cs])=>`<div class="part">${esc(l)}</div>${cs.map(row).join('')}`).join('')}<div class="foot">© Scholar Computer Institute, Nizamabad – Azamgarh</div>`}
const ak=h=>(h||'').split(/(?=<h3>)/).map(s=>{s=s.replace(/<h4>Self-Check[^<]*<\/h4>(?:<p>[\s\S]*?<\/p>)*/,'');const m=s.match(/^<h3>(.*?)<\/h3>/);if(m&&/Self-Check\s*\(/.test(m[1]))return '';return m&&/Answer Key|उत्तर-कुंजी/i.test(m[1])?`<details class="gd ep"><summary>${m[1]}</summary>${s.slice(m[0].length)}</details>`:s}).join('');
const strip=q=>q.replace(/^<p><b>[^<]*<\/b><\/p>/,'');
const card=(p,k,d,o)=>{const L=lvOf(p.q);return `<details class="pcd${d[k]?' done':''}" id="p${p.n}"${o?' open':''}><summary><span class="pn">${p.n}</span><span class="pt">${p.title}</span><span class="lv" style="--c:var(${LV[L][1]})">${LV[L][0]} ${L}</span><span class="ck">${d[k]?'✓':''}</span></summary><div class="pq">${strip(p.q)}</div><p class="flow">Try yourself → Hint → Solution</p><div class="btns">${p.hint?'<button data-r="h">💡 Hint</button>':''}${p.full?'<button data-r="f">✅ Solution</button>':''}<button data-d="${k}">${d[k]?'☑ Done':'☐ Done'}</button></div><div class="rv h" hidden>${p.hint}</div><div class="rv f" hidden>${p.full}</div></details>`};
async function chapter(num,pn){const c=await ldc(num);IDX=IDX||await j('index.json');const i=IDX.findIndex(x=>x.num===num),pv=IDX[i-1],nx=IDX[i+1],d=done(),tot=c.problems.length,lc={};
 c.problems.forEach(p=>{const L=lvOf(p.q);lc[L]=(lc[L]||0)+1});const first=pn?+pn:0;const pt=IDX[i].part||'';
 $.innerHTML=`<div class="top"><a class="nb" href="#/">← All Chapters</a></div><div class="part" style="margin-top:12px">${esc(pt)}</div><h1 class="t" style="text-align:left">Chapter ${num}: ${c.title}</h1><div class="pm" id="cp"></div><div id="cb"></div>${chips(lc)}${c.intro?`<details class="gd"><summary>📘 Chapter Intro</summary>${c.intro}</details>`:''}${c.guide?`<details class="gd"><summary>📖 Chapter Guide</summary>${c.guide}</details>`:''}${c.problems.map(p=>card(p,num+'-'+p.n,d,p.n==first)).join('')}${ak(c.outro)}${c.solOutro?`<details class="gd ep"><summary>💡 Self-Check Q&amp;A</summary>${c.solOutro.replace(/^\s*<h3>[^<]*Self-Check[^<]*<\/h3>/,'')}</details>`:''}<div class="top">${pv?`<a class="nb" href="#/ch/${pv.num}">← Ch ${pv.num}</a>`:'<span></span>'}${nx?`<a class="nb" href="#/ch/${nx.num}">Ch ${nx.num} →</a>`:''}</div>`;
 const upd=()=>{const n=nDone(num);document.getElementById('cp').textContent=n+' / '+tot+' done';document.getElementById('cb').innerHTML=bar(n,tot).replace('class="pg"','class="pg" style="margin-left:0"')};upd();
 $.querySelectorAll('.pcd').forEach(cd=>{cd.querySelectorAll('.rv').forEach(r=>{if(!r.innerHTML.trim())r.remove()});
  cd.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=cd.querySelector('.rv.'+b.dataset.r);r.hidden=!r.hidden;b.classList.toggle('on',!r.hidden)});
  const db=cd.querySelector('[data-d]');db.onclick=()=>{const s=done(),k=db.dataset.d;s[k]?delete s[k]:s[k]=1;save(s);cd.classList.toggle('done',!!s[k]);cd.querySelector('.ck').textContent=s[k]?'✓':'';db.textContent=s[k]?'☑ Done':'☐ Done';upd()}});
 const acc=L=>{L=[...L];L.forEach(x=>x.addEventListener('toggle',()=>{if(!x.open)return;L.forEach(o=>{if(o!==x&&o.open)o.open=false});if(x.classList.contains('pcd'))setTimeout(()=>x.scrollIntoView({block:'start',behavior:'smooth'}),80)}))};acc($.querySelectorAll('.pcd'));acc($.querySelectorAll(':scope > details.gd:not(.ep)'));
 if(pn){const e=document.getElementById('p'+pn);if(e)setTimeout(()=>e.scrollIntoView({block:'start'}),50)}else scrollTo(0,0)}
async function level(L){IDX=IDX||await j('index.json');const all=await Promise.all(IDX.map(c=>ldc(c.num))),d=done();let h=`<div class="top"><a class="nb" href="#/">← All Chapters</a></div><h1 class="t" style="text-align:left">${LV[L][0]} ${L} problems</h1><div class="pm">${LVC[L]} problems — chapter के क्रम में</div><div class="rs">`;
 all.forEach((c,i)=>c.problems.filter(p=>lvOf(p.q)==L).forEach(p=>{h+=`<a href="#/ch/${IDX[i].num}/${p.n}"><b>${d[IDX[i].num+'-'+p.n]?'✓ ':''}Ch ${IDX[i].num} · P${p.n} — ${p.title}</b><small>${c.title}</small></a>`}));$.innerHTML=h+'</div>';scrollTo(0,0)}
async function route(){const h=location.hash,m=h.match(/#\/ch\/(\d+)(?:\/(\d+))?/),l=h.match(/#\/lv\/(\w+)/);try{m?await chapter(m[1],m[2]):l&&LV[l[1]]?await level(l[1]):await home()}catch(e){$.innerHTML='<p class="sub">डेटा नहीं खुल पाया। पेज को GitHub Pages (या किसी server) से खोलिए, सीधे फ़ाइल से नहीं।</p>'}}
let T;document.getElementById('q').oninput=e=>{clearTimeout(T);const q=e.target.value.trim().toLowerCase();if(q.length<2){route();return}T=setTimeout(async()=>{IDX=IDX||await j('index.json');const all=await Promise.all(IDX.map(c=>ldc(c.num))),R=[];
 all.forEach((c,i)=>c.problems.forEach(p=>{const t=tx(p.title+' '+p.q+' '+p.hint+' '+p.full),x=t.toLowerCase().indexOf(q);if(x>=0)R.push([p.title.toLowerCase().includes(q)?-1e3:-(t.toLowerCase().split(q).length-1),`<a href="#/ch/${IDX[i].num}/${p.n}" onclick="document.getElementById('q').value=''"><b>Ch ${IDX[i].num} · P${p.n} — ${p.title}</b><small>${hl(t.slice(Math.max(0,x-40),x+90),q)}</small></a>`])}));
 R.sort((a,b)=>a[0]-b[0]);$.innerHTML=R.length?`<h2>🔎 ${R.length} results</h2><div class="rs">${R.slice(0,40).map(r=>r[1]).join('')}</div>`:'<h2>🔎 No results</h2><p class="sub">कोई दूसरा या छोटा शब्द आज़माइए, जैसे “GST”, “Journal”, “TDS”।</p>'},250)};
addEventListener('hashchange',route);route();
(()=>{const u=document.getElementById('su'),d=document.getElementById('sd'),de=document.documentElement;
const upd=()=>{const y=scrollY,mx=de.scrollHeight-innerHeight;u.classList.toggle('v',y>250);d.classList.toggle('v',mx>400&&mx-y>250)};
addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);addEventListener('hashchange',()=>setTimeout(upd,300));new ResizeObserver(upd).observe(document.body);
u.onclick=()=>scrollTo({top:0,behavior:'smooth'});d.onclick=()=>scrollTo({top:de.scrollHeight,behavior:'smooth'});upd()})();
</script></body></html>
